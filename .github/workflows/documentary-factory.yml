name: Documentary Factory (2x Weekly)

on:
  schedule:
    # Wednesday & Saturday 11:00 UTC -> feeds 16:00 UTC global Documentary peak slot
    - cron: '0 11 * * 3,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render & QC only, DO NOT upload to YouTube)'
        type: boolean
        default: false
      place:
        description: 'Optional destination override (e.g. Banff National Park)'
        type: string
        default: ''
      publish_now:
        description: 'Publish immediately instead of scheduling at 16:00 UTC'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: campuncharted-state
  cancel-in-progress: false

jobs:
  produce-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg & Bold TrueType Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto fonts-dejavu-core
          fc-cache -f

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Produce & Publish Cinematic Documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_CHANNEL_ID: UCwzbmfB6P-s7RrZqHA1JCqw
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "${{ inputs.place }}" ]; then ARGS+=(--place "${{ inputs.place }}"); fi
          if [ "${{ inputs.publish_now }}" = "true" ]; then ARGS+=(--publish-now); fi
          campuncharted produce-doc "${ARGS[@]}"

      - name: Upload preview artifacts (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-output-${{ github.run_id }}
          path: build_output/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated studio state
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "CampUncharted Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): record Documentary publish $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
