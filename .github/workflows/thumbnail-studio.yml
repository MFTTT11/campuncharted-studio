name: Thumbnail Studio (Manual Refresh & Preview)

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Specific YouTube video ID to upgrade (leave blank to refresh latest videos from history)'
        type: string
        default: ''
      recent:
        description: 'Number of most recent channel videos to refresh when video_id is blank (1-8)'
        type: string
        default: '1'
      format_type:
        description: 'Thumbnail format override when video_id is specified (auto, documentary, short)'
        type: choice
        default: auto
        options:
          - auto
          - documentary
          - short
      hook:
        description: 'Optional 2-3 word ALL-CAPS hook override (e.g. NEVER DO THIS)'
        type: string
        default: ''
      label:
        description: 'Optional kicker badge label override (e.g. BANFF NATIONAL PARK)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run (generate & upload preview artifact only, DO NOT update YouTube)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Bold TrueType Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto fonts-dejavu-core
          fc-cache -f

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Generate & Apply High-CTR Pro Thumbnails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CHANNEL_ID: UCwzbmfB6P-s7RrZqHA1JCqw
        run: |
          ARGS=(--recent "${{ inputs.recent || '1' }}" --format "${{ inputs.format_type || 'auto' }}")
          if [ -n "${{ inputs.video_id }}" ]; then ARGS+=(--video-id "${{ inputs.video_id }}"); fi
          if [ -n "${{ inputs.hook }}" ]; then ARGS+=(--hook "${{ inputs.hook }}"); fi
          if [ -n "${{ inputs.label }}" ]; then ARGS+=(--label "${{ inputs.label }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          campuncharted refresh-thumbnail "${ARGS[@]}"

      - name: Upload generated thumbnail previews (1-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ github.run_id }}
          path: build_output/*_thumb*.jpg
          retention-days: 1
          if-no-files-found: ignore
