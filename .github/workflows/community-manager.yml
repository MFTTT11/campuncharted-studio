name: Community Comment Manager (Every 4h)

on:
  schedule:
    # 6 lightweight runs/day aligned ~17 min after peak Short publish slots (13:15, 18:15, 23:15 UTC)
    - cron: '32 1,6,11,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (draft replies without posting to YouTube)'
        type: boolean
        default: false
      max_replies:
        description: 'Max replies to post in this run'
        type: string
        default: '8'

permissions:
  contents: write

concurrency:
  group: campuncharted-state
  cancel-in-progress: false

jobs:
  engage-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Post Newly-Due Starter Comments & English CC
        if: inputs.dry_run != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CHANNEL_ID: UCwzbmfB6P-s7RrZqHA1JCqw
        run: campuncharted backfill-subtitles --max-captions 1 || echo "[I18N] Skipped transient subtitle check"

      - name: Scan & Reply to New Viewer Comments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CHANNEL_ID: UCwzbmfB6P-s7RrZqHA1JCqw
        run: |
          ARGS=(--max-replies "${{ inputs.max_replies || '8' }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          campuncharted engage-comments "${ARGS[@]}"

      - name: Commit updated comment reply state
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "CampUncharted Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(comments): record viewer comment replies $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
