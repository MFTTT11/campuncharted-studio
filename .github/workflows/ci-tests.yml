name: CI Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'README.md'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto fonts-dejavu-core
          fc-cache -f

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install --no-deps -e .

      - name: Run full test suite (unit + real FFmpeg E2E render QC)
        run: pytest -v
